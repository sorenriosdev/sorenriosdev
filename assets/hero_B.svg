<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Soren Rios, AI Engineer. Applied AI, built to be reliable.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#151922"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6ea8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6ea8ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <circle cx="720" cy="40" r="240" fill="url(#glow)">
    <animate attributeName="cx" values="680;760;680" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;1;0.55" dur="7s" repeatCount="indefinite"/>
  </circle>
  <text x="56" y="120" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="600" letter-spacing="-2" fill="#f5f5f7">Soren Rios</text>
  <text x="58" y="172" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#a1a1a6">AI Engineer. Applied AI, built to be reliable.</text>
  <rect x="56" y="214" width="788" height="1" fill="url(#line)"/>
</svg>
